body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1a0b2e,#050508 60%);color:#F0F0F5;font-family:"DM Sans",system-ui,-apple-system,sans-serif}
